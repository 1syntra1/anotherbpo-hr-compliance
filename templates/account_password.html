{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-bottom fw-semibold py-3">
        <i class="bi bi-key-fill me-2 text-teal" aria-hidden="true"></i>Change your password
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('account_password') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="current_password" class="form-label fw-semibold small">Current password</label>
            <input type="password" id="current_password" name="current_password" class="form-control"
                   required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label fw-semibold small">New password</label>
            <input type="password" id="new_password" name="new_password" class="form-control"
                   required minlength="12" autocomplete="new-password" aria-describedby="pwHelp">
            <small id="pwHelp" class="text-muted">At least 12 characters, not containing your username.</small>
          </div>
          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                   required minlength="12" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-teal w-100">Change password</button>
          <p class="text-muted small mt-3 mb-0">Changing your password signs you out on every other device.</p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
